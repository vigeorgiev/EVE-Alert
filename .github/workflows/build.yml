name: Build Windows EXE

on:
  push:
    branches:
      - 'chatgpt/windows-build'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        python -m PyInstaller --noconfirm --clean --onefile --windowed --icon "evealert/img/eve.ico" --name "EVE-Alert" --add-data "evealert/img;evealert/img" --add-data "evealert/sound;evealert/sound" --add-data "evealert/docs;evealert/docs" --collect-all customtkinter main.py

    - name: Create archive
      shell: pwsh
      run: |
        Compress-Archive -Path dist/EVE-Alert.exe -DestinationPath EVE-Alert-Windows.zip

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: EVE-Alert-Windows
        path: EVE-Alert-Windows.zip
        retention-days: 30
